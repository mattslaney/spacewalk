[package]
name = "spacewalk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Explore disk usage with a linked terminal file tree and treemap"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
unicode-width = "0.2"
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_vendor = "apple"))'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
